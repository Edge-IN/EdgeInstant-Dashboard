<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18765c">
  <meta name="description" content="EdgeInstant evaluation results: greedy and sampled benchmark scores.">
  <title>EdgeInstant · Results</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to results</a>
  <aside class="sidebar" aria-label="Evaluation runs">
    <a class="brand" href="#run=greedy">EdgeInstant</a>
    <div class="nav-caption">EXPLORE</div>
    <nav id="navigation"></nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="page-heading"><h1 id="page-title">Greedy</h1><span id="run-meta"></span></div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" aria-label="Switch to dark theme"></button>
        <button id="share" class="button">Copy link</button>
        <button id="export" class="button">Export CSV</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="content" aria-live="polite"><div class="loading">Loading…</div></div>
    </main>
  </div>
  <div id="toast" role="status"></div>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <div id="chart-tooltip" class="chart-tooltip" role="tooltip" hidden></div>
  <noscript><p>JavaScript required. <a href="data/dashboard.json">JSON data</a></p></noscript>
</body>
</html>
